name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: black --check
        run: uv run black --check src tests

      - name: ruff check
        run: uv run ruff check src tests

      - name: mypy
        run: uv run mypy

      - name: bandit
        run: uv run bandit -q -r src

      - name: pip-audit
        run: uv run pip-audit

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-groups

      - name: pytest
        run: uv run pytest --cov=bookstack_cli --cov-report=term-missing --cov-fail-under=100 -q -m "not integration"
